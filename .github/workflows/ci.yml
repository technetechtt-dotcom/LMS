name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:

jobs:
  frontend:
    name: frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: npm run build:ops

  e2e:
    name: e2e-playwright
    runs-on: ubuntu-latest
    needs: [frontend, backend]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: lms_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      CI: 'true'
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/lms_e2e
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/lms_e2e
      JWT_SECRET: ci-jwt-secret-change-me-not-production-32
      NODE_ENV: test
      E2E_EXPOSE_INVITATION_TOKEN: '1'
      FRONTEND_ORIGIN: http://localhost:5173
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run test:e2e:install
      - name: Prepare database
        working-directory: backend
        run: |
          npm ci
          npx prisma generate
          npx prisma migrate deploy
          npm run seed
          npm run build
      - name: Start application stack with retained logs
        run: |
          mkdir -p test-artifacts/logs
          (cd backend && npm run start:prod > ../test-artifacts/logs/backend.log 2>&1) &
          echo $! >> test-artifacts/processes
          (VITE_API_URL=http://localhost:8787 npm run dev -- --host 127.0.0.1 --port 5173 > test-artifacts/logs/frontend.log 2>&1) &
          echo $! >> test-artifacts/processes
          (VITE_API_URL=http://localhost:8787 VITE_AUTH_PORTAL=ops npm run dev:ops -- --host 127.0.0.1 > test-artifacts/logs/ops.log 2>&1) &
          echo $! >> test-artifacts/processes
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://localhost:8787/health/live >/dev/null \
              && curl --fail --silent http://localhost:5173/login >/dev/null \
              && curl --fail --silent http://localhost:5177/login >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          tail -n 200 test-artifacts/logs/*.log
          exit 1
      - name: Run Playwright workflows
        env:
          PLAYWRIGHT_SKIP_WEBSERVER: '1'
        run: npm run test:e2e
      - name: Capture failed-run database and health diagnostics
        if: failure()
        run: |
          mkdir -p test-artifacts
          psql "$DATABASE_URL" -c "select status, count(*) from \"AssessmentSubmission\" group by status order by status" > test-artifacts/db-assessment-state.txt 2>&1 || true
          psql "$DATABASE_URL" -c "select status, count(*) from \"UploadRecord\" group by status order by status" > test-artifacts/db-upload-state.txt 2>&1 || true
          psql "$DATABASE_URL" -c "select action, count(*) from \"AuditLog\" group by action order by count(*) desc limit 30" > test-artifacts/db-audit-state.txt 2>&1 || true
          curl --silent --show-error http://localhost:8787/health/ready > test-artifacts/api-health.json 2>&1 || true
      - name: Upload Playwright diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-diagnostics-${{ github.run_id }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            playwright-report
            test-results
            test-artifacts

  backend:
    name: backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: lms_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/lms_test
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/lms_test
      JWT_SECRET: ci-jwt-secret-change-me-not-production-32
      NODE_ENV: test
      RUN_DB_E2E: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      - run: npx prisma migrate deploy
      - run: npm run typecheck
      - run: npm test -- --coverage --coverageReporters=text-summary
      - run: npm run build

  security:
    name: security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Frontend dependency audit
        run: npm audit --omit=dev --audit-level=high
      - name: Backend dependency audit
        working-directory: backend
        env:
          NPM_CONFIG_FETCH_RETRIES: '2'
          NPM_CONFIG_FETCH_TIMEOUT: '60000'
        run: |
          npm ci
          for attempt in 1 2 3; do
            npm audit --omit=dev --audit-level=high && exit 0
            if [ "$attempt" -eq 3 ]; then exit 1; fi
            echo "npm audit failed; retrying ($attempt/3)"
            sleep 10
          done
      - name: Generate SBOM (frontend)
        run: npx --yes @cyclonedx/cyclonedx-npm --ignore-npm-errors --output-file sbom-frontend.json
      - name: Generate SBOM (backend)
        working-directory: backend
        run: npx --yes @cyclonedx/cyclonedx-npm --ignore-npm-errors --output-file sbom-backend.json
      - name: Secret scan (gitleaks)
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz | tar xz
          ./gitleaks detect --source . --verbose --exit-code 1

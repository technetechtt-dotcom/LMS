# Render Blueprint — https://render.com/docs/blueprint-spec
# Repo: SkillForge LMS (Nest API + Vite SPA, Neon Postgres external)

services:
  - type: web
    name: lms-api
    runtime: node
    rootDir: backend
    plan: starter
    # Neon LMS project is aws-us-east-1; Ohio (us-east-2) keeps API latency low.
    region: ohio
    branch: main
    # Releases are triggered by the protected CI/staging workflow.
    autoDeployTrigger: off
    buildCommand: npm ci --include=dev && npm run build
    preDeployCommand: npm run prisma:migrate:deploy:retry
    startCommand: npm run start:prod
    healthCheckPath: /health
    buildFilter:
      paths:
        - backend/**
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 1d
      - key: REFRESH_TOKEN_TTL_DAYS
        value: "7"
      - key: PASSWORD_RESET_TTL_MINUTES
        value: "60"
      - key: FRONTEND_ORIGIN
        fromService:
          name: lms-web
          type: web
          envVarKey: RENDER_EXTERNAL_URL
      - key: OPS_ORIGIN
        fromService:
          name: lms-ops
          type: web
          envVarKey: RENDER_EXTERNAL_URL
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: UPLOAD_MAX_MB
        value: "25"
      - key: UPLOAD_RETENTION_DAYS
        value: "2555"
      - key: OBJECT_STORAGE_ENDPOINT
        sync: false
      - key: OBJECT_STORAGE_BUCKET
        sync: false
      - key: OBJECT_STORAGE_REGION
        sync: false
      - key: OBJECT_STORAGE_ACCESS_KEY_ID
        sync: false
      - key: OBJECT_STORAGE_SECRET_ACCESS_KEY
        sync: false
      - key: OBJECT_STORAGE_FORCE_PATH_STYLE
        value: "true"
      - key: MALWARE_SCAN_URL
        sync: false
      - key: MALWARE_SCAN_TOKEN
        sync: false
      - key: MAIL_DELIVERY_URL
        sync: false
      - key: MAIL_DELIVERY_TOKEN
        sync: false
      - key: PUBLIC_REGISTRATION
        value: "false"
      - key: ADMIN_ENDPOINTS_ENABLED
        value: "true"

  - type: web
    name: lms-web
    runtime: static
    branch: main
    autoDeployTrigger: off
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    buildFilter:
      paths:
        - src/**
        - public/**
        - index.html
        - vite.config.ts
        - package.json
        - package-lock.json
        - tailwind.config.js
        - postcss.config.js
        - tsconfig.json
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: Permissions-Policy
        value: camera=(), microphone=(), geolocation=()
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /index.html
        name: Cache-Control
        value: no-cache
      - path: /sw.js
        name: Cache-Control
        value: no-cache
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: VITE_API_URL
        fromService:
          name: lms-api
          type: web
          envVarKey: RENDER_EXTERNAL_URL
      - key: VITE_OPS_URL
        fromService:
          name: lms-ops
          type: web
          envVarKey: RENDER_EXTERNAL_URL

  - type: web
    name: lms-ops
    runtime: static
    branch: main
    autoDeployTrigger: off
    buildCommand: npm ci && npm run build:ops
    staticPublishPath: dist-ops
    buildFilter:
      paths:
        - src/**
        - ops-portal/**
        - public/**
        - vite.ops.config.ts
        - package.json
        - package-lock.json
        - tailwind.config.js
        - postcss.config.js
        - tsconfig.json
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: Permissions-Policy
        value: camera=(), microphone=(), geolocation=()
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /index.html
        name: Cache-Control
        value: no-cache
      - path: /sw.js
        name: Cache-Control
        value: no-cache
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: VITE_API_URL
        fromService:
          name: lms-api
          type: web
          envVarKey: RENDER_EXTERNAL_URL
      - key: VITE_AUTH_PORTAL
        value: ops

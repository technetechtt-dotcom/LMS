# Render Blueprint — https://render.com/docs/blueprint-spec
# Repo: SkillForge LMS (Nest API + Vite SPA, Neon Postgres external)

services:
  - type: web
    name: lms-api
    runtime: node
    rootDir: backend
    plan: starter
    region: frankfurt
    buildCommand: npm ci --include=dev && npm run build
    preDeployCommand: npm run prisma:migrate:deploy
    startCommand: npm run start:prod
    healthCheckPath: /health
    buildFilter:
      paths:
        - backend/**
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 1d
      - key: REFRESH_TOKEN_TTL_DAYS
        value: "7"
      - key: FRONTEND_ORIGIN
        fromService:
          name: lms-web
          type: web
          envVarKey: RENDER_EXTERNAL_URL
      - key: OPS_ORIGIN
        fromService:
          name: lms-ops
          type: web
          envVarKey: RENDER_EXTERNAL_URL
      - key: FILE_STORAGE
        value: s3
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: AWS_S3_BUCKET
        sync: false
      - key: AWS_REGION
        value: af-south-1
      - key: MAIL_PROVIDER
        value: smtp
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: AV_SCAN_MODE
        value: http
      - key: AV_SCAN_URL
        sync: false
      - key: LOG_PASSWORD_RESET_LINK
        value: "false"
      - key: PUBLIC_REGISTRATION
        value: "false"
      - key: ADMIN_ENDPOINTS_ENABLED
        value: "false"
      - key: SETA_GATEWAY_URL
        sync: false

  - type: web
    name: lms-web
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    buildFilter:
      paths:
        - src/**
        - public/**
        - index.html
        - vite.config.ts
        - package.json
        - package-lock.json
        - tailwind.config.js
        - postcss.config.js
        - tsconfig.json
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          name: lms-api
          type: web
          envVarKey: RENDER_EXTERNAL_URL

  - type: web
    name: lms-ops
    runtime: static
    buildCommand: npm ci && npm run build:ops
    staticPublishPath: dist-ops
    buildFilter:
      paths:
        - src/**
        - ops-portal/**
        - public/**
        - vite.ops.config.ts
        - package.json
        - package-lock.json
        - tailwind.config.js
        - postcss.config.js
        - tsconfig.json
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          name: lms-api
          type: web
          envVarKey: RENDER_EXTERNAL_URL
      - key: VITE_AUTH_PORTAL
        value: ops
